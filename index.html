<!DOCTYPE html>
<html lang="es">

<head>
  <script>window.huggingface = { variables: { "SPACE_CREATOR_USER_ID": "61b253b7ac5ecaae3d1efe0c" } };</script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asistente Visual</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="app">
    <div id="videoContainer">
      <video id="videoFeed" autoplay playsinline></video>
      <div id="loadingOverlay">Loading...</div>

      <!-- The answer reads as subtitles over the camera: big enough for a
           passer-by, and it leaves the side panel for controls. -->
      <div id="subtitles">
        <span id="autoBadge" class="badge hidden">demo automática</span>
        <p id="responseText"></p>
      </div>
    </div>

    <canvas id="canvas" class="hidden"></canvas>

    <aside class="io-areas">
      <div>
        <label>Modo:</label>
        <div id="modes" class="presets"></div>
      </div>
      <div>
        <label>Preguntas rápidas:</label>
        <div id="presets" class="presets"></div>
      </div>
      <div>
        <label for="instructionText">Instrucción:</label>
        <textarea id="instructionText" name="Instruction"></textarea>
      </div>
      <div class="button-row">
        <button id="startButton" class="start">Analizar</button>
        <button id="micButton" title="Hablarle (pulsa y habla)">🎤</button>
        <button id="speakToggle" title="Leer la respuesta en voz alta">🔊</button>
      </div>
      <div class="frame-block">
        <label>Fotograma analizado:</label>
        <img id="lastFrame" class="hidden" alt="Fotograma analizado" />
        <div id="timing" class="timing"></div>
      </div>
    </aside>
  </div>

  <script type="module" src="script.js"></script>
</body>

</html>
