<!DOCTYPE html>
<html lang="es">

<head>
  <script>window.huggingface = { variables: { "SPACE_CREATOR_USER_ID": "61b253b7ac5ecaae3d1efe0c" } };</script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asistente Visual</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="app">
    <div id="videoContainer">
      <video id="videoFeed" autoplay playsinline></video>
      <div id="loadingOverlay">Loading...</div>
    </div>

    <canvas id="canvas" class="hidden"></canvas>

    <aside class="io-areas">
      <div>
        <label>Preguntas rápidas:</label>
        <div id="presets" class="presets"></div>
      </div>
      <div>
        <label for="instructionText">Instrucción:</label>
        <textarea id="instructionText" name="Instruction"></textarea>
      </div>
      <div class="response-block">
        <label for="responseText">Respuesta:</label>
        <textarea id="responseText" name="Response" readonly></textarea>
      </div>
      <div class="button-row">
        <button id="startButton" class="start">Analizar</button>
        <button id="speakToggle" title="Leer la respuesta en voz alta">🔊</button>
      </div>
    </aside>
  </div>

  <script type="module" src="script.js"></script>
</body>

</html>
